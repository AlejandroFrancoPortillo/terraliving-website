<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <title>Broccoli Flower</title>
  <desc>A small broccoli flower head with clusters of tiny florets in a cross pattern typical of Brassica plants, in sage botanical line-art.</desc>

  <!-- Main stem -->
  <path d="M100 195 C100 195 100 175 100 155 C100 140 100 128 100 118"
    stroke="#7C8B6A" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Leaf at base of stem — broad brassica leaf -->
  <path d="M100 155 C90 148 75 142 65 146 C58 149 58 158 65 162 C76 167 92 162 100 155"
    stroke="#7C8B6A" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Leaf midrib and veins -->
  <path d="M100 155 C88 155 76 156 65 158" stroke="#7C8B6A" stroke-width="0.6" stroke-linecap="round" opacity="0.5"/>
  <path d="M85 152 C82 148 80 144 80 140" stroke="#7C8B6A" stroke-width="0.4" stroke-linecap="round" opacity="0.4"/>
  <path d="M76 155 C73 151 72 146 73 142" stroke="#7C8B6A" stroke-width="0.4" stroke-linecap="round" opacity="0.4"/>

  <!-- Main stem branches at top splitting into floret clusters -->
  <!-- Central branch continues up -->
  <!-- Left main branch -->
  <path d="M100 118 C95 112 88 106 82 100" stroke="#7C8B6A" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Right main branch -->
  <path d="M100 118 C105 112 112 106 118 100" stroke="#7C8B6A" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Center continues -->
  <path d="M100 118 C100 112 100 105 100 98" stroke="#7C8B6A" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Secondary branching — left cluster -->
  <path d="M82 100 C78 94 74 90 70 85" stroke="#7C8B6A" stroke-width="1" stroke-linecap="round"/>
  <path d="M82 100 C80 93 80 88 82 82" stroke="#7C8B6A" stroke-width="1" stroke-linecap="round"/>
  <path d="M82 100 C84 94 88 90 90 85" stroke="#7C8B6A" stroke-width="1" stroke-linecap="round"/>

  <!-- Secondary branching — center cluster -->
  <path d="M100 98 C96 92 92 88 88 82" stroke="#7C8B6A" stroke-width="1" stroke-linecap="round"/>
  <path d="M100 98 C100 90 100 85 100 78" stroke="#7C8B6A" stroke-width="1" stroke-linecap="round"/>
  <path d="M100 98 C104 92 108 88 112 82" stroke="#7C8B6A" stroke-width="1" stroke-linecap="round"/>

  <!-- Secondary branching — right cluster -->
  <path d="M118 100 C116 94 112 90 110 85" stroke="#7C8B6A" stroke-width="1" stroke-linecap="round"/>
  <path d="M118 100 C120 93 120 88 118 82" stroke="#7C8B6A" stroke-width="1" stroke-linecap="round"/>
  <path d="M118 100 C122 94 126 90 130 85" stroke="#7C8B6A" stroke-width="1" stroke-linecap="round"/>

  <!-- The 4-petaled cross flowers (brassica characteristic) -->
  <!-- Each tiny flower: 4 petals in cross arrangement + center -->

  <!-- Floret at tip — left cluster left -->
  <g transform="translate(70,85)">
    <path d="M0 0 C-2 -4 -2 -8 0 -9 C2 -8 2 -4 0 0" stroke="#7C8B6A" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M0 0 C4 -2 8 -2 9 0 C8 2 4 2 0 0" stroke="#7C8B6A" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M0 0 C2 4 2 8 0 9 C-2 8 -2 4 0 0" stroke="#7C8B6A" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M0 0 C-4 2 -8 2 -9 0 C-8 -2 -4 -2 0 0" stroke="#7C8B6A" stroke-width="0.7" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.5" stroke="#7C8B6A" stroke-width="0.6"/>
  </g>

  <!-- Floret — left cluster center -->
  <g transform="translate(82,82)">
    <path d="M0 0 C-2 -4 -2 -8 0 -9 C2 -8 2 -4 0 0" stroke="#7C8B6A" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M0 0 C4 -2 8 -2 9 0 C8 2 4 2 0 0" stroke="#7C8B6A" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M0 0 C2 4 2 8 0 9 C-2 8 -2 4 0 0" stroke="#7C8B6A" stroke-width="0.7" stroke-linecap="round"/>
