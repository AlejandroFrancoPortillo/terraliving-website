  <!-- Floret — left cluster right -->
  <g transform="translate(90,82)">
    <path d="M0 0 C-2 -4 -2 -8 0 -9 C2 -8 2 -4 0 0" stroke="#7C8B6A" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M0 0 C4 -2 8 -2 9 0 C8 2 4 2 0 0" stroke="#7C8B6A" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M0 0 C2 4 2 8 0 9 C-2 8 -2 4 0 0" stroke="#7C8B6A" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M0 0 C-4 2 -8 2 -9 0 C-8 -2 -4 -2 0 0" stroke="#7C8B6A" stroke-width="0.7" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.5" stroke="#7C8B6A" stroke-width="0.6"/>
  </g>

  <!-- Floret — center cluster left -->
  <g transform="translate(88,78)">
    <path d="M0 0 C-2 -4 -2 -8 0 -9 C2 -8 2 -4 0 0" stroke="#7C8B6A" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M0 0 C4 -2 8 -2 9 0 C8 2 4 2 0 0" stroke="#7C8B6A" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M0 0 C2 4 2 8 0 9 C-2 8 -2 4 0 0" stroke="#7C8B6A" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M0 0 C-4 2 -8 2 -9 0 C-8 -2 -4 -2 0 0" stroke="#7C8B6A" stroke-width="0.7" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.5" stroke="#7C8B6A" stroke-width="0.6"/>
  </g>

  <!-- Floret — center cluster top -->
  <g transform="translate(100,74)">
    <path d="M0 0 C-2 -4 -2 -8 0 -9 C2 -8 2 -4 0 0" stroke="#7C8B6A" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M0 0 C4 -2 8 -2 9 0 C8 2 4 2 0 0" stroke="#7C8B6A" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M0 0 C2 4 2 8 0 9 C-2 8 -2 4 0 0" stroke="#7C8B6A" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M0 0 C-4 2 -8 2 -9 0 C-8 -2 -4 -2 0 0" stroke="#7C8B6A" stroke-width="0.7" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.5" stroke="#7C8B6A" stroke-width="0.6"/>
  </g>

  <!-- Floret — center cluster right -->
  <g transform="translate(112,78)">
    <path d="M0 0 C-2 -4 -2 -8 0 -9 C2 -8 2 -4 0 0" stroke="#7C8B6A" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M0 0 C4 -2 8 -2 9 0 C8 2 4 2 0 0" stroke="#7C8B6A" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M0 0 C2 4 2 8 0 9 C-2 8 -2 4 0 0" stroke="#7C8B6A" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M0 0 C-4 2 -8 2 -9 0 C-8 -2 -4 -2 0 0" stroke="#7C8B6A" stroke-width="0.7" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.5" stroke="#7C8B6A" stroke-width="0.6"/>
  </g>

  <!-- Floret — right cluster left -->
  <g transform="translate(110,82)">
    <path d="M0 0 C-2 -4 -2 -8 0 -9 C2 -8 2 -4 0 0" stroke="#7C8B6A" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M0 0 C4 -2 8 -2 9 0 C8 2 4 2 0 0" stroke="#7C8B6A" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M0 0 C2 4 2 8 0 9 C-2 8 -2 4 0 0" stroke="#7C8B6A" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M0 0 C-4 2 -8 2 -9 0 C-8 -2 -4 -2 0 0" stroke="#7C8B6A" stroke-width="0.7" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.5" stroke="#7C8B6A" stroke-width="0.6"/>
  </g>

  <!-- Floret — right cluster center -->
  <g transform="translate(118,78)">
    <path d="M0 0 C-2 -4 -2 -8 0 -9 C2 -8 2 -4 0 0" stroke="#7C8B6A" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M0 0 C4 -2 8 -2 9 0 C8 2 4 2 0 0" stroke="#7C8B6A" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M0 0 C2 4 2 8 0 9 C-2 8 -2 4 0 0" stroke="#7C8B6A" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M0 0 C-4 2 -8 2 -9 0 C-8 -2 -4 -2 0 0" stroke="#7C8B6A" stroke-width="0.7" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.5" stroke="#7C8B6A" stroke-width="0.6"/>
  </g>

  <!-- Floret — right cluster right -->
  <g transform="translate(130,82)">
    <path d="M0 0 C-2 -4 -2 -8 0 -9 C2 -8 2 -4 0 0" stroke="#7C8B6A" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M0 0 C4 -2 8 -2 9 0 C8 2 4 2 0 0" stroke="#7C8B6A" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M0 0 C2 4 2 8 0 9 C-2 8 -2 4 0 0" stroke="#7C8B6A" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M0 0 C-4 2 -8 2 -9 0 C-8 -2 -4 -2 0 0" stroke="#7C8B6A" stroke-width="0.7" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.5" stroke="#7C8B6A" stroke-width="0.6"/>
