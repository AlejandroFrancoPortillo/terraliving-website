<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" fill="none">
  <title>Brain Chocolate Product Hero</title>
  <desc>A hand snapping a square from a dark chocolate bar, with scattered cacao nibs and a cacao pod accent — hand-drawn ink botanical illustration.</desc>

  <!-- Bone background -->
  <rect width="800" height="1000" fill="#F8F4EC"/>

  <!-- Subtle warm atmosphere — very faint background grain -->
  <g opacity="0.03" stroke="#2A2620" stroke-width="0.6">
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="0" y1="750" x2="800" y2="750"/>
  </g>

  <!-- =============================================
       CHOCOLATE BAR — center, main subject
       Long rectangle scored into 8 squares
       ============================================= -->

  <!-- The bar is shown mid-snap — slightly angled, dynamic composition -->
  <!-- Main bar body — 7 squares still connected -->
  <!-- Rotated slightly: bar goes from upper-left to lower-right at ~12° -->

  <!-- Bar body — all 8 sections' outer boundary, before snap -->
  <!-- We show the bar mostly intact but with the left-most square being snapped off -->

  <!-- Main 7-square bar (right section) -->
  <g transform="translate(400, 500) rotate(8)">
    <!-- Outer bar rectangle — 7 squares: each square ~54×54, bar ~378×54 -->
    <rect x="-190" y="-100" width="378" height="100" rx="6"
      stroke="#2A2620" stroke-width="1.5" fill="#F8F4EC" fill-opacity="0.65"/>

    <!-- Score lines — 6 internal dividers for 7 squares -->
    <line x1="-136" y1="-100" x2="-136" y2="0" stroke="#2A2620" stroke-width="0.9" opacity="0.6"/>
    <line x1="-82" y1="-100" x2="-82" y2="0" stroke="#2A2620" stroke-width="0.9" opacity="0.6"/>
    <line x1="-28" y1="-100" x2="-28" y2="0" stroke="#2A2620" stroke-width="0.9" opacity="0.6"/>
    <line x1="26" y1="-100" x2="26" y2="0" stroke="#2A2620" stroke-width="0.9" opacity="0.6"/>
    <line x1="80" y1="-100" x2="80" y2="0" stroke="#2A2620" stroke-width="0.9" opacity="0.6"/>
    <line x1="134" y1="-100" x2="134" y2="0" stroke="#2A2620" stroke-width="0.9" opacity="0.6"/>

    <!-- Horizontal score line at midpoint of each square — subtle -->
    <line x1="-190" y1="-50" x2="188" y2="-50" stroke="#2A2620" stroke-width="0.5" opacity="0.3"/>

    <!-- Break edge at left where square was snapped — slightly jagged -->
    <path d="M-190 -100 C-192 -96 -194 -90 -192 -82 C-190 -74 -186 -68 -188 -58 C-190 -48 -192 -40 -190 -30 C-188 -20 -186 -10 -190 0"
      stroke="#2A2620" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Dark chocolate surface detail — subtle diagonal highlights -->
    <path d="M-140 -96 C-100 -90 -40 -88 20 -90 C80 -92 140 -96 180 -96"
      stroke="#2A2620" stroke-width="0.4" stroke-linecap="round" opacity="0.12"/>
    <path d="M-130 -10 C-80 -6 0 -4 80 -6 C140 -8 175 -10 180 -10"
      stroke="#2A2620" stroke-width="0.4" stroke-linecap="round" opacity="0.12"/>

    <!-- Embossed detail — small letters/logo suggestion within one square -->
    <text x="-80" y="-38" font-size="8" font-family="Georgia,serif" fill="#2A2620" fill-opacity="0.18" text-anchor="middle" letter-spacing="1">TERRA</text>
  </g>

  <!-- Snapped square — the 8th square being held/snapped off -->
  <!-- Slightly offset from bar, rotated differently as if being snapped -->
  <g transform="translate(192, 486) rotate(-5)">
    <!-- Single square -->
    <rect x="-27" y="-54" width="54" height="54" rx="4"
      stroke="#2A2620" stroke-width="1.4" fill="#F8F4EC" fill-opacity="0.7"/>
    <!-- Score lines within the square — 4 inner sections -->
    <line x1="0" y1="-54" x2="0" y2="0" stroke="#2A2620" stroke-width="0.8" opacity="0.55"/>
    <line x1="-27" y1="-27" x2="27" y2="-27" stroke="#2A2620" stroke-width="0.8" opacity="0.55"/>
    <!-- Break edge on right side — rough -->
    <path d="M27 -54 C29 -48 30 -40 28 -32 C26 -24 28 -16 28 -8 C28 0 27 0 27 0"
      stroke="#2A2620" stroke-width="0.9" stroke-linecap="round" opacity="0.55"/>
    <!-- Chocolate gloss -->
    <path d="M-22 -50 C-10 -46 0 -46 14 -48" stroke="#2A2620" stroke-width="0.4" stroke-linecap="round" opacity="0.15"/>
  </g>

  <!-- =============================================
       HAND — mid-motion, snapping the square
       Right hand, index finger and thumb gripping the square
       ============================================= -->

  <!-- Simplified hand — elegant abstraction -->
  <!-- Palm area — lower left of the square being snapped -->
  <path d="M130 490
    C120 496 110 502 100 510
    C90 518 82 528 80 540
    C78 552 82 562 90 566
    C98 570 108 568 116 560"
    stroke="#2A2620" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Thumb — pressing on square from below -->
  <path d="M116 560 C130 554 148 550 162 546 C172 542 178 536 176 530
    C174 524 166 520 154 520 C142 520 132 524 124 530"
    stroke="#2A2620" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Index finger — curling over top of square -->
  <path d="M90 462 C100 456 114 452 124 450 C134 448 140 450 142 456
    C144 462 140 468 132 472 C124 476 116 478 112 482"
    stroke="#2A2620" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Middle finger hint -->
  <path d="M76 472 C86 466 98 462 108 462"
    stroke="#2A2620" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.45"/>

  <!-- Thumb knuckle line -->
  <path d="M145 520 C148 514 152 510 158 510" stroke="#2A2620" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>

  <!-- Tension line — snap stress mark between bar and square -->
  <path d="M192 466 C193 460 196 454 200 450 C204 446 208 445 210 448 C212 452 210 458 207 462"
    stroke="#2A2620" stroke-width="0.8" stroke-linecap="round" opacity="0.3"/>

  <!-- =============================================
       CACAO NIBS — scattered nearby
       Small irregular fragments
       ============================================= -->
  <g stroke="#2A2620" stroke-linecap="round">
    <!-- Nib 1 — larger fragment -->
    <path d="M560 580 C564 574 572 574 575 580 C575 586 568 590 562 587 C558 584 558 580 560 580Z"
      stroke-width="1"/>
    <!-- Nib 2 -->
    <path d="M590 610 C593 604 601 604 604 610 C604 616 597 620 591 617 C587 614 587 610 590 610Z"
      stroke-width="1"/>
    <!-- Nib 3 -->
    <path d="M540 618 C543 613 549 613 552 618 C552 623 546 626 541 624 C537 621 537 618 540 618Z"
      stroke-width="1"/>
    <!-- Nib 4 — smaller -->
    <path d="M610 578 C613 574 618 575 619 579 C619 583 614 586 610 583 C608 581 608 578 610 578Z"
      stroke-width="0.9"/>
    <!-- Nib 5 -->
    <path d="M572 640 C575 636 580 637 581 641 C581 645 576 647 572 645 C570 643 570 640 572 640Z"
      stroke-width="0.9"/>
    <!-- Nib 6 — tiny -->
    <path d="M624 602 C626 599 630 599 631 602 C631 605 628 607 624 605 Z"
      stroke-width="0.8" opacity="0.7"/>
    <!-- Nib 7 -->
    <path d="M558 650 C561 646 566 647 567 651 C567 655 562 657 558 655 Z"
      stroke-width="0.8" opacity="0.7"/>
  </g>

  <!-- =============================================
       CACAO POD + LEAF — lower left corner, botanical accent
       ============================================= -->

  <!-- Small cacao pod — lower left -->
  <g transform="translate(148, 820) rotate(-30)" opacity="0.72">
    <!-- Pod shape — smaller version -->
    <path d="M0 -80
      C4 -78 12 -72 16 -58
      C20 -44 20 -24 16 -10
      C12 4 6 12 0 14
      C-6 12 -12 4 -16 -10
      C-20 -24 -20 -44 -16 -58
      C-12 -72 -4 -78 0 -80Z"
      stroke="#7C8B6A" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Pod ridges -->
    <path d="M-6 -76 C-10 -60 -10 -30 -8 -6" stroke="#7C8B6A" stroke-width="0.6" stroke-linecap="round" opacity="0.5"/>
    <path d="M6 -76 C10 -60 10 -30 8 -6" stroke="#7C8B6A" stroke-width="0.6" stroke-linecap="round" opacity="0.5"/>
    <path d="M-12 -68 C-15 -52 -14 -24 -13 -2" stroke="#7C8B6A" stroke-width="0.5" stroke-linecap="round" opacity="0.4"/>
    <path d="M12 -68 C15 -52 14 -24 13 -2" stroke="#7C8B6A" stroke-width="0.5" stroke-linecap="round" opacity="0.4"/>
    <!-- Pod stem -->
    <line x1="0" y1="-80" x2="0" y2="-92" stroke="#7C8B6A" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Leaf beside pod -->
  <g transform="translate(170, 740) rotate(-10)" opacity="0.65">
    <!-- Leaf outline -->
    <path d="M0 60 C0 60 -16 52 -22 38 C-28 24 -26 4 -16 -8 C-6 -20 8 -24 20 -20 C30 -16 38 -6 38 6 C38 20 32 36 20 48 C12 56 4 60 0 60Z"
      stroke="#7C8B6A" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Midrib -->
    <path d="M0 60 C4 44 12 26 22 8 C28 -2 32 -12 36 -18"
      stroke="#7C8B6A" stroke-width="0.6" stroke-linecap="round" opacity="0.5"/>
    <!-- Lateral veins -->
    <path d="M8 50 C14 44 20 40 26 38" stroke="#7C8B6A" stroke-width="0.4" stroke-linecap="round" opacity="0.4"/>
    <path d="M12 38 C18 32 24 30 30 28" stroke="#7C8B6A" stroke-width="0.4" stroke-linecap="round" opacity="0.4"/>
    <path d="M16 26 C20 20 26 18 32 16" stroke="#7C8B6A" stroke-width="0.4" stroke-linecap="round" opacity="0.4"/>
    <path d="M4 56 C-2 50 -8 44 -14 38" stroke="#7C8B6A" stroke-width="0.4" stroke-linecap="round" opacity="0.35"/>
    <path d="M4 44 C-2 38 -8 32 -14 26" stroke="#7C8B6A" stroke-width="0.4" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- Small additional cacao nib fragment near pod -->
  <g transform="translate(190, 830)" stroke="#7C8B6A" stroke-width="0.7" opacity="0.5">
    <path d="M0 0 C3 -4 8 -4 9 0 C9 4 5 6 1 5 Z"/>
    <path d="M14 8 C17 4 22 4 23 8 C23 12 19 14 15 13 Z"/>
  </g>

  <!-- Loose cacao nib line near bar — crumbled texture from snap -->
  <g stroke="#2A2620" stroke-width="0.6" stroke-linecap="round" opacity="0.35">
    <path d="M260 498 C264 494 270 495 271 499 C271 503 266 504 262 502 Z"/>
    <path d="M272 514 C275 510 281 511 282 515 C282 519 277 520 273 518 Z"/>
    <path d="M248 516 C251 512 256 513 257 517 C257 521 252 522 248 520 Z"/>
  </g>
</svg>
