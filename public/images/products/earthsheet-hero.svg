<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" fill="none">
  <title>Earthsheet Product Hero</title>
  <desc>A grounding earthsheet draped over the foot of a bed, with silver-fibre grid detail, grounding cord, and ginkgo leaf accents — hand-drawn ink botanical illustration.</desc>

  <!-- Bone background -->
  <rect width="800" height="1000" fill="#F8F4EC"/>

  <!-- Subtle atmosphere — very faint horizontal grain -->
  <g opacity="0.04" stroke="#2A2620" stroke-width="0.5">
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="0" y1="800" x2="800" y2="800"/>
  </g>

  <!-- =============================================
       BED — low-angle view, foot of bed
       ============================================= -->

  <!-- Bed frame footboard — simple horizontal rail suggesting low wooden frame -->
  <path d="M60 680 C160 676 300 674 400 674 C500 674 640 676 740 680"
    stroke="#2A2620" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
  <!-- Footboard secondary rail -->
  <path d="M80 696 C180 692 300 690 400 690 C500 690 620 692 720 696"
    stroke="#2A2620" stroke-width="1.2" stroke-linecap="round" opacity="0.35"/>

  <!-- Bed legs — two visible -->
  <path d="M80 690 C80 700 80 720 80 740 C80 750 82 754 88 756"
    stroke="#2A2620" stroke-width="1.8" stroke-linecap="round" opacity="0.4"/>
  <path d="M720 690 C720 700 720 720 720 740 C720 750 718 754 712 756"
    stroke="#2A2620" stroke-width="1.8" stroke-linecap="round" opacity="0.4"/>

  <!-- Mattress edge — visible below the sheet, a thick horizontal band -->
  <path d="M65 640 C160 636 300 634 400 634 C500 634 640 636 735 640"
    stroke="#2A2620" stroke-width="1" stroke-linecap="round" opacity="0.3"/>
  <!-- Mattress depth / side -->
  <path d="M65 640 C64 650 64 662 65 674"
    stroke="#2A2620" stroke-width="1" stroke-linecap="round" opacity="0.2"/>
  <path d="M735 640 C736 650 736 662 735 674"
    stroke="#2A2620" stroke-width="1" stroke-linecap="round" opacity="0.2"/>

  <!-- Pillow at head of bed — suggested as a simple rounded rectangle far back -->
  <path d="M240 200
    C244 192 260 186 320 184
    C380 182 400 182 460 184
    C520 186 538 192 542 200
    C540 212 524 218 462 220
    C400 222 380 222 320 220
    C260 218 244 212 240 200Z"
    stroke="#2A2620" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" fill="#F8F4EC" fill-opacity="0.6" opacity="0.4"/>
  <!-- Pillow crease -->
  <path d="M391 184 C390 200 390 212 391 220" stroke="#2A2620" stroke-width="0.5" stroke-linecap="round" opacity="0.25"/>

  <!-- =============================================
       EARTHSHEET — draped over foot of bed
       Main product feature
       ============================================= -->

  <!-- Sheet body — slightly gathered, draping over the footboard -->
  <!-- Upper portion of sheet on mattress surface — receding into distance -->
  <path d="M100 300
    C100 300 130 292 200 290
    C280 288 380 288 400 288
    C420 288 520 288 600 290
    C670 292 700 296 700 300
    C700 350 700 400 700 450
    C700 480 700 500 700 520
    L600 524 C520 526 420 528 400 528
    C380 528 280 526 200 524
    L100 520
    C100 500 100 480 100 450
    C100 400 100 350 100 300Z"
    stroke="#2A2620" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
    fill="#F8F4EC" fill-opacity="0.8"/>

  <!-- Silver-fibre conductive grid on sheet — the hero detail -->
  <!-- Horizontal grid lines -->
  <g stroke="#8C8276" stroke-width="0.8" opacity="0.45">
    <line x1="105" y1="314" x2="695" y2="302"/>
    <line x1="105" y1="334" x2="695" y2="322"/>
    <line x1="105" y1="354" x2="695" y2="342"/>
    <line x1="105" y1="374" x2="695" y2="362"/>
    <line x1="105" y1="394" x2="695" y2="382"/>
    <line x1="105" y1="414" x2="695" y2="402"/>
    <line x1="105" y1="434" x2="695" y2="422"/>
    <line x1="105" y1="454" x2="695" y2="442"/>
    <line x1="105" y1="474" x2="695" y2="462"/>
    <line x1="105" y1="494" x2="695" y2="482"/>
    <line x1="105" y1="514" x2="695" y2="502"/>
  </g>

  <!-- Vertical grid lines -->
  <g stroke="#8C8276" stroke-width="0.8" opacity="0.45">
    <line x1="140" y1="294" x2="140" y2="522"/>
    <line x1="180" y1="292" x2="180" y2="522"/>
    <line x1="220" y1="291" x2="220" y2="522"/>
    <line x1="260" y1="290" x2="260" y2="522"/>
    <line x1="300" y1="289" x2="300" y2="523"/>
    <line x1="340" y1="288" x2="340" y2="524"/>
    <line x1="380" y1="288" x2="380" y2="524"/>
    <line x1="420" y1="288" x2="420" y2="524"/>
    <line x1="460" y1="288" x2="460" y2="524"/>
    <line x1="500" y1="289" x2="500" y2="524"/>
    <line x1="540" y1="290" x2="540" y2="523"/>
    <line x1="580" y1="291" x2="580" y2="523"/>
    <line x1="620" y1="292" x2="620" y2="522"/>
    <line x1="660" y1="294" x2="660" y2="522"/>
  </g>

  <!-- Sheet draping over footboard — gathered fold at footboard edge -->
  <path d="M100 520
    C100 540 102 555 106 568
    C108 578 112 590 118 600
    L140 606
    C160 610 200 614 240 616
    C280 618 340 618 400 618
    C460 618 520 618 560 616
    C600 614 640 610 660 606
    L682 600
    C688 590 692 578 694 568
    C698 555 700 540 700 520"
    stroke="#2A2620" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"
    fill="#F8F4EC" fill-opacity="0.75"/>

  <!-- Fabric fold/drape texture at footboard -->
  <path d="M160 524 C158 542 158 560 162 574" stroke="#2A2620" stroke-width="0.7" stroke-linecap="round" opacity="0.3"/>
  <path d="M240 526 C238 544 240 562 244 576" stroke="#2A2620" stroke-width="0.7" stroke-linecap="round" opacity="0.3"/>
  <path d="M400 528 C400 546 400 564 402 578" stroke="#2A2620" stroke-width="0.7" stroke-linecap="round" opacity="0.3"/>
  <path d="M560 526 C560 544 562 562 566 576" stroke="#2A2620" stroke-width="0.7" stroke-linecap="round" opacity="0.3"/>
  <path d="M640 524 C640 542 642 560 648 574" stroke="#2A2620" stroke-width="0.7" stroke-linecap="round" opacity="0.3"/>

  <!-- Lower hanging portion of sheet below footboard -->
  <path d="M140 606 C138 630 140 660 146 680"
    stroke="#2A2620" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  <path d="M660 606 C662 630 660 660 654 680"
    stroke="#2A2620" stroke-width="1" stroke-linecap="round" opacity="0.4"/>

  <!-- Grounding cord — exits from bottom right corner of sheet -->
  <!-- Cord runs from sheet bottom corner, curves to floor -->
  <path d="M650 616 C654 630 658 650 658 670 C658 690 656 710 652 726"
    stroke="#2A2620" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Cord continues to floor with slight coil -->
  <path d="M652 726 C648 742 640 756 628 762 C616 768 600 768 584 766"
    stroke="#2A2620" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Plug — 3-prong AU spec -->
  <rect x="568" y="758" width="18" height="26" rx="3" stroke="#2A2620" stroke-width="1.2" fill="none"/>
  <!-- Prongs — AU 3-pin angled layout -->
  <line x1="572" y1="784" x2="570" y2="794" stroke="#2A2620" stroke-width="1" stroke-linecap="round"/>
  <line x1="582" y1="784" x2="584" y2="794" stroke="#2A2620" stroke-width="1" stroke-linecap="round"/>
  <line x1="577" y1="784" x2="577" y2="794" stroke="#2A2620" stroke-width="1" stroke-linecap="round"/>

  <!-- Safety resistor inline — small barrel shape on cord -->
  <path d="M655 700 C655 700 660 698 664 700 C664 704 664 708 660 710 C656 710 654 708 654 704 C654 700 655 700 655 700Z"
    stroke="#2A2620" stroke-width="0.9" fill="none"/>
  <!-- Resistor label lines -->
  <line x1="652" y1="704" x2="648" y2="704" stroke="#2A2620" stroke-width="0.7"/>
  <line x1="666" y1="704" x2="670" y2="704" stroke="#2A2620" stroke-width="0.7"/>

  <!-- =============================================
       GINKGO LEAF ACCENTS — bottom corners
       ============================================= -->

  <!-- Bottom left ginkgo leaf -->
  <g transform="translate(110, 870) rotate(-15)" opacity="0.7">
    <!-- Stem -->
    <line x1="0" y1="50" x2="0" y2="20" stroke="#7C8B6A" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Fan left lobe -->
    <path d="M0 20 C-8 16 -20 8 -28 0 C-34 -6 -36 -14 -32 -20 C-26 -26 -16 -24 -8 -16 C-4 -12 0 -4 0 4"
      stroke="#7C8B6A" stroke-width="1.1" stroke-linecap="round" fill="none"/>
    <!-- Fan right lobe -->
    <path d="M0 20 C8 16 20 8 28 0 C34 -6 36 -14 32 -20 C26 -26 16 -24 8 -16 C4 -12 0 -4 0 4"
      stroke="#7C8B6A" stroke-width="1.1" stroke-linecap="round" fill="none"/>
    <!-- Cleft line -->
    <line x1="0" y1="4" x2="0" y2="-18" stroke="#7C8B6A" stroke-width="0.6" stroke-linecap="round"/>
    <!-- Veins left -->
    <path d="M0 20 C-6 12 -14 4 -24 -4" stroke="#7C8B6A" stroke-width="0.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M0 20 C-4 10 -12 2 -28 -8" stroke="#7C8B6A" stroke-width="0.4" stroke-linecap="round" opacity="0.5"/>
    <!-- Veins right -->
    <path d="M0 20 C6 12 14 4 24 -4" stroke="#7C8B6A" stroke-width="0.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M0 20 C4 10 12 2 28 -8" stroke="#7C8B6A" stroke-width="0.4" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Bottom right ginkgo leaf — slightly different rotation -->
  <g transform="translate(690, 900) rotate(20)" opacity="0.55">
    <line x1="0" y1="40" x2="0" y2="14" stroke="#7C8B6A" stroke-width="1" stroke-linecap="round"/>
    <path d="M0 14 C-7 10 -18 3 -24 -4 C-28 -10 -28 -18 -24 -22 C-18 -26 -10 -22 -4 -14 C-2 -10 0 -4 0 2"
      stroke="#7C8B6A" stroke-width="1" stroke-linecap="round" fill="none"/>
    <path d="M0 14 C7 10 18 3 24 -4 C28 -10 28 -18 24 -22 C18 -26 10 -22 4 -14 C2 -10 0 -4 0 2"
      stroke="#7C8B6A" stroke-width="1" stroke-linecap="round" fill="none"/>
    <line x1="0" y1="2" x2="0" y2="-18" stroke="#7C8B6A" stroke-width="0.5" stroke-linecap="round"/>
    <path d="M0 14 C-5 8 -12 2 -20 -6" stroke="#7C8B6A" stroke-width="0.4" stroke-linecap="round" opacity="0.5"/>
    <path d="M0 14 C5 8 12 2 20 -6" stroke="#7C8B6A" stroke-width="0.4" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- A second ginkgo leaf overlapping, slightly — creates naturalistic grouping -->
  <g transform="translate(148, 920) rotate(-30)" opacity="0.45">
    <line x1="0" y1="34" x2="0" y2="10" stroke="#7C8B6A" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M0 10 C-6 6 -16 0 -20 -6 C-24 -12 -22 -20 -18 -22 C-12 -24 -6 -18 -2 -10 C0 -6 0 -2 0 4"
      stroke="#7C8B6A" stroke-width="0.9" stroke-linecap="round" fill="none"/>
    <path d="M0 10 C6 6 16 0 20 -6 C24 -12 22 -20 18 -22 C12 -24 6 -18 2 -10 C0 -6 0 -2 0 4"
      stroke="#7C8B6A" stroke-width="0.9" stroke-linecap="round" fill="none"/>
  </g>
</svg>
