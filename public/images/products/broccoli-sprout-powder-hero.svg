      <path d="M0 0 C4 -1 7 -1 8 0 C7 1 4 1 0 0"/>
      <path d="M0 0 C1 4 1 7 0 8 C-1 7 -1 4 0 0"/>
      <path d="M0 0 C-4 1 -7 1 -8 0 C-7 -1 -4 -1 0 0"/>
