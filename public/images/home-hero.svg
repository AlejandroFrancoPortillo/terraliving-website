  <!-- Sheet fold line — top edge has a folded-over portion showing different facing -->
  <path d="M80 350 C120 342 200 340 280 342 C310 343 330 346 340 348"
    stroke="#2A2620" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <!-- Fold shadow — a subtle line below fold -->
  <path d="M82 358 C120 352 200 350 280 352 C310 353 330 355 340 356"
    stroke="#2A2620" stroke-width="0.6" stroke-linecap="round" opacity="0.3"/>

  <!-- Folded-over top flap (different face of fabric) -->
  <path d="M80 350 C80 348 80 344 82 342 C120 338 200 336 280 338 C310 339 332 342 340 344
           C340 346 340 348 340 348
           C320 346 300 344 280 342 C200 340 120 342 80 350Z"
    stroke="none" fill="#EFE8DD" fill-opacity="0.5"/>

  <!-- Grounding cord — dangles from bottom corner of sheet -->
  <path d="M300 580 C302 590 304 604 308 618 C312 632 318 642 324 648"
    stroke="#2A2620" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Cord plug end — small rectangle -->
  <rect x="320" y="646" width="10" height="16" rx="2" stroke="#2A2620" stroke-width="1.1" fill="none"/>
  <!-- Plug prongs -->
  <line x1="323" y1="662" x2="323" y2="668" stroke="#2A2620" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="327" y1="662" x2="327" y2="668" stroke="#2A2620" stroke-width="0.9" stroke-linecap="round"/>

  <!-- Sheet corner crease marks — give fabric life -->
  <path d="M80 565 C84 568 88 572 90 576" stroke="#2A2620" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
  <path d="M330 348 C333 352 336 356 338 360" stroke="#2A2620" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>


  <!-- =============================================
       CENTER: CERAMIC TEAPOT
       ============================================= -->

  <!-- Teapot body — round, low, slightly flattened -->
  <path d="M700 480
    C700 480 660 478 640 460
    C622 443 618 418 628 400
    C638 382 660 372 690 370
    C720 368 748 374 764 392
    C780 410 778 438 760 456
    C742 472 720 480 700 480Z"
    stroke="#2A2620" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="#F8F4EC" fill-opacity="0.7"/>

  <!-- Teapot spout — curved, angled left -->
  <path d="M636 436 C622 430 606 424 596 418 C588 413 586 408 590 404 C594 400 602 400 612 404 C622 408 634 416 642 424"
    stroke="#2A2620" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Spout opening hole -->
  <path d="M588 408 C588 404 592 400 596 401" stroke="#2A2620" stroke-width="1" stroke-linecap="round"/>

  <!-- Teapot handle — curved C shape right side -->
  <path d="M760 416 C778 416 792 424 796 436 C800 448 794 462 778 464 C770 465 762 462 758 456"
    stroke="#2A2620" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Teapot lid — small, flat disc with button finial -->
  <path d="M678 370 C688 366 712 366 722 370 C726 372 726 376 720 378 C710 380 690 380 680 378 C674 376 674 372 678 370Z"
    stroke="#2A2620" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="#F8F4EC" fill-opacity="0.8"/>
  <!-- Lid finial knob -->
  <path d="M700 366 C697 362 697 356 700 354 C703 356 703 362 700 366" stroke="#2A2620" stroke-width="1" stroke-linecap="round"/>

  <!-- Teapot surface detail — subtle horizontal lines suggesting glaze -->
  <path d="M642 415 C660 408 700 406 728 408 C748 410 760 415 760 420"
    stroke="#2A2620" stroke-width="0.5" stroke-linecap="round" opacity="0.2"/>
  <path d="M630 440 C648 432 700 430 742 432 C758 434 766 440 762 446"
    stroke="#2A2620" stroke-width="0.5" stroke-linecap="round" opacity="0.2"/>

  <!-- Teapot shadow line at base — grounding -->
  <path d="M638 478 C660 484 700 486 740 484 C760 482 772 478 774 476"
    stroke="#8C8276" stroke-width="0.6" stroke-linecap="round" opacity="0.3"/>

  <!-- Steam wisps rising from spout and lid -->
  <!-- Steam from spout -->
  <path d="M590 400 C586 390 590 378 586 366 C582 354 578 344 582 332"
    stroke="#2A2620" stroke-width="0.9" stroke-linecap="round" opacity="0.35"/>
  <path d="M594 398 C598 386 594 374 598 362 C602 350 606 340 602 328"
    stroke="#2A2620" stroke-width="0.7" stroke-linecap="round" opacity="0.25"/>
  <!-- Steam from lid -->
  <path d="M698 354 C694 344 698 332 694 320 C690 308 686 298 690 286"
    stroke="#2A2620" stroke-width="0.9" stroke-linecap="round" opacity="0.3"/>
  <path d="M704 354 C708 342 704 330 708 318 C712 306 716 298 712 286"
    stroke="#2A2620" stroke-width="0.7" stroke-linecap="round" opacity="0.2"/>


  <!-- =============================================
       RIGHT OF CENTER: CHOCOLATE SQUARE
       ============================================= -->

  <!-- Single chocolate square — slightly angled, as if placed casually -->
  <g transform="translate(900, 440) rotate(-8)">
    <!-- Square main body -->
    <rect x="-30" y="-30" width="60" height="60" rx="3"
      stroke="#2A2620" stroke-width="1.4" fill="#F8F4EC" fill-opacity="0.6"/>
    <!-- Score lines suggesting it was broken from a bar -->
    <!-- Horizontal score — top -->
    <line x1="-30" y1="-10" x2="30" y2="-10" stroke="#2A2620" stroke-width="0.7" opacity="0.5"/>
    <!-- Vertical score — left -->
    <line x1="-10" y1="-30" x2="-10" y2="30" stroke="#2A2620" stroke-width="0.7" opacity="0.5"/>
    <!-- Broken edge suggestion — slightly ragged left top corner -->
    <path d="M-30 -30 C-28 -28 -25 -25 -24 -28 C-23 -31 -26 -33 -28 -30 C-29 -27 -30 -30 -30 -30Z"
      stroke="#2A2620" stroke-width="0.8" fill="none" opacity="0.4"/>
    <!-- Surface sheen — diagonal line suggesting glossy chocolate -->
    <path d="M-18 -24 C-8 -14 2 -4 10 4" stroke="#2A2620" stroke-width="0.5" stroke-linecap="round" opacity="0.15"/>
  </g>

  <!-- Small cocoa nib fragments scattered near chocolate square -->
  <!-- Nib 1 -->
  <path d="M958 450 C960 447 965 448 966 451 C965 454 960 455 958 452 Z"
    stroke="#2A2620" stroke-width="0.8" fill="none" opacity="0.5"/>
  <!-- Nib 2 -->
  <path d="M942 475 C944 472 948 473 949 476 C948 479 944 479 942 476 Z"
    stroke="#2A2620" stroke-width="0.8" fill="none" opacity="0.5"/>
  <!-- Nib 3 -->
  <path d="M968 480 C970 477 975 478 975 481 C974 484 970 484 968 481 Z"
    stroke="#2A2620" stroke-width="0.8" fill="none" opacity="0.4"/>
  <!-- Nib 4 — tiny fragment -->
  <path d="M946 455 C947 453 950 454 950 456 C949 458 947 458 946 456 Z"
    stroke="#2A2620" stroke-width="0.7" fill="none" opacity="0.4"/>

  <!-- Small shadow beneath chocolate square -->
  <ellipse cx="900" cy="478" rx="38" ry="6" stroke="#8C8276" stroke-width="0.5" fill="none" opacity="0.2"/>


