  <!-- Cornflower — a small round bloom suggestion near the herbs (adding variety) -->
  <g transform="translate(560, 390)" stroke="#7C8B6A" stroke-width="0.7" opacity="0.6">
    <!-- Stem -->
    <line x1="0" y1="30" x2="0" y2="0" stroke-linecap="round"/>
    <!-- Petals — radiating around center -->
    <path d="M0 0 C-3 -8 -2 -14 0 -15 C2 -14 3 -8 0 0"/>
    <path d="M0 0 C7 -5 12 -4 13 -2 C12 0 7 2 0 0"/>
    <path d="M0 0 C5 7 4 12 2 13 C0 12 -4 8 0 0"/>
    <path d="M0 0 C-7 5 -12 4 -13 2 C-12 0 -7 -4 0 0"/>
    <path d="M0 0 C-5 -7 -4 -12 -2 -13 C0 -12 4 -8 0 0"/>
    <path d="M0 0 C7 5 8 10 6 12 C4 12 0 8 0 0"/>
    <!-- Center -->
