    <line x1="1167" y1="360" x2="1167" y2="470"/>
    <line x1="1176" y1="354" x2="1176" y2="475"/>
    <line x1="1188" y1="352" x2="1188" y2="476"/>
    <line x1="1200" y1="352" x2="1200" y2="477"/>
    <line x1="1212" y1="352" x2="1212" y2="476"/>
    <line x1="1224" y1="354" x2="1224" y2="475"/>
    <line x1="1233" y1="360" x2="1233" y2="470"/>
    <line x1="1240" y1="378" x2="1240" y2="460"/>
  </g>

  <!-- Powder level inside jar — occupying roughly bottom half -->
  <path d="M1156 428 C1168 424 1192 422 1200 422 C1208 422 1232 424 1244 428"
    stroke="#2A2620" stroke-width="1" stroke-linecap="round" opacity="0.4"/>

  <!-- Powder stipple — sage dotted fill below powder line -->
  <g opacity="0.2" stroke="#7C8B6A">
    <circle cx="1168" cy="440" r="1.5"/>
    <circle cx="1178" cy="448" r="1.5"/>
    <circle cx="1190" cy="434" r="1.5"/>
    <circle cx="1202" cy="442" r="1.5"/>
    <circle cx="1214" cy="436" r="1.5"/>
    <circle cx="1226" cy="444" r="1.5"/>
    <circle cx="1236" cy="440" r="1.5"/>
    <circle cx="1172" cy="458" r="1"/>
    <circle cx="1186" cy="464" r="1"/>
    <circle cx="1198" cy="460" r="1"/>
    <circle cx="1210" cy="456" r="1"/>
    <circle cx="1222" cy="462" r="1"/>
    <circle cx="1234" cy="456" r="1"/>
    <circle cx="1165" cy="468" r="1"/>
    <circle cx="1175" cy="472" r="1"/>
    <circle cx="1190" cy="474" r="1"/>
    <circle cx="1205" cy="470" r="1"/>
    <circle cx="1218" cy="473" r="1"/>
    <circle cx="1230" cy="468" r="1"/>
    <circle cx="1240" cy="464" r="1"/>
  </g>

  <!-- Jar glass highlights — very faint vertical lines -->
  <line x1="1164" y1="362" x2="1164" y2="440" stroke="#F8F4EC" stroke-width="1" opacity="0.5"/>
  <line x1="1170" y1="356" x2="1170" y2="435" stroke="#F8F4EC" stroke-width="0.6" opacity="0.4"/>

  <!-- Jar base shadow -->
  <ellipse cx="1200" cy="480" rx="46" ry="7" stroke="#8C8276" stroke-width="0.5" fill="none" opacity="0.22"/>

  <!-- Label area on jar — a thin rectangle with a line for product label -->
  <rect x="1165" y="392" width="70" height="40" rx="2" stroke="#2A2620" stroke-width="0.6" fill="none" opacity="0.25"/>


  <!-- =============================================
       SCATTERED DRIED HERB FRAGMENTS
       Small sage line marks dispersed across the runner area
       ============================================= -->

  <!-- Herb fragment cluster 1 — between sheet and teapot -->
  <g stroke="#7C8B6A" stroke-width="0.8" stroke-linecap="round">
    <!-- Small leaf shards -->
    <path d="M450 430 C452 426 458 424 460 428 C458 432 452 432 450 430"/>
    <path d="M470 452 C468 448 462 447 460 451 C462 455 468 456 470 452"/>
    <path d="M480 418 C482 414 488 415 488 419 C486 422 481 421 480 418"/>
    <path d="M440 465 C442 461 448 462 447 466 C445 469 440 468 440 465"/>
    <path d="M510 438 C508 434 503 434 503 438 C504 442 509 442 510 438"/>
    <!-- Tiny stem fragments -->
    <line x1="455" y1="442" x2="465" y2="448"/>
    <line x1="495" y1="425" x2="500" y2="432"/>
    <line x1="465" y1="460" x2="472" y2="466"/>
  </g>

  <!-- Herb fragment cluster 2 — between teapot and chocolate -->
  <g stroke="#7C8B6A" stroke-width="0.8" stroke-linecap="round">
    <path d="M810 450 C812 446 818 446 818 450 C817 454 812 454 810 450"/>
    <path d="M830 432 C832 428 837 429 836 433 C834 436 829 435 830 432"/>
    <path d="M850 460 C848 456 843 456 843 460 C844 464 849 464 850 460"/>
    <line x1="820" y1="440" x2="828" y2="446"/>
    <line x1="840" y1="450" x2="846" y2="456"/>
  </g>

  <!-- Herb fragment cluster 3 — right side, between chocolate and jar -->
  <g stroke="#7C8B6A" stroke-width="0.8" stroke-linecap="round">
    <path d="M1050 430 C1052 426 1058 427 1057 431 C1055 434 1050 433 1050 430"/>
    <path d="M1070 452 C1068 448 1063 449 1063 453 C1064 456 1069 456 1070 452"/>
    <path d="M1090 440 C1092 436 1097 437 1096 441 C1094 444 1090 443 1090 440"/>
    <line x1="1055" y1="442" x2="1062" y2="448"/>
    <line x1="1078" y1="432" x2="1084" y2="438"/>
  </g>

  <!-- Herb fragment cluster 4 — far right, near jar -->
  <g stroke="#7C8B6A" stroke-width="0.7" stroke-linecap="round" opacity="0.7">
    <path d="M1310 440 C1312 436 1317 437 1316 441 C1314 444 1310 443 1310 440"/>
    <path d="M1330 458 C1328 454 1323 455 1323 459 C1324 462 1329 462 1330 458"/>
    <line x1="1316" y1="450" x2="1322" y2="456"/>
  </g>

  <!-- Herb fragment — upper area, sparse -->
  <g stroke="#7C8B6A" stroke-width="0.7" stroke-linecap="round" opacity="0.5">
