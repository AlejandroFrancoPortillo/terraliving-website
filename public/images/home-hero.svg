<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none">
  <title>Terraliving Home Hero — Flat-lay Ritual Objects</title>
  <desc>An overhead linen-runner scene featuring an earthsheet textile, ceramic teapot with steam, chocolate square, amber jar, and scattered dried herbs — rendered in hand-drawn ink botanical line-art on a warm bone background.</desc>

  <!-- Background — warm bone -->
  <rect width="1600" height="900" fill="#F8F4EC"/>

  <!-- Faint diagonal grain marks suggesting linen/paper texture — very sparse, low opacity -->
  <!-- Diagonal lines group — running SW to NE -->
  <g opacity="0.035" stroke="#2A2620" stroke-width="0.8">
    <line x1="0" y1="300" x2="300" y2="0"/>
    <line x1="0" y1="500" x2="500" y2="0"/>
    <line x1="0" y1="700" x2="700" y2="0"/>
    <line x1="0" y1="900" x2="900" y2="0"/>
    <line x1="200" y1="900" x2="1100" y2="0"/>
    <line x1="400" y1="900" x2="1300" y2="0"/>
    <line x1="600" y1="900" x2="1500" y2="0"/>
    <line x1="800" y1="900" x2="1600" y2="100"/>
    <line x1="1000" y1="900" x2="1600" y2="300"/>
    <line x1="1200" y1="900" x2="1600" y2="500"/>
    <line x1="1400" y1="900" x2="1600" y2="700"/>
  </g>

  <!-- Linen runner — wide horizontal band slightly warmer than background -->
  <!-- Subtle tint: a very faint warm rectangle spanning full width, centered vertically -->
  <rect x="0" y="290" width="1600" height="320" fill="#EFE8DD" opacity="0.45"/>

  <!-- Linen runner top and bottom edge — very faint, hand-drawn feel -->
  <path d="M0 292 C200 290 400 293 600 291 C800 289 1000 292 1200 290 C1400 288 1550 291 1600 290"
    stroke="#8C8276" stroke-width="0.8" opacity="0.2" stroke-linecap="round"/>
  <path d="M0 608 C200 610 400 607 600 609 C800 611 1000 608 1200 610 C1400 612 1550 609 1600 610"
    stroke="#8C8276" stroke-width="0.8" opacity="0.2" stroke-linecap="round"/>

  <!-- =============================================
       LEFT THIRD: EARTHSHEET (hero object)
       Intentionally quieter / less dense for headline overlay
       ============================================= -->

  <!-- Folded earthsheet textile — draped fabric rectangle, slightly angled for naturalness -->
  <!-- Main sheet body -->
  <path d="M80 350 C85 345 120 340 180 342 C240 344 300 346 340 348
           C340 348 342 430 340 480 C338 520 335 560 330 580
           C290 582 240 580 180 578 C130 576 90 572 80 565
           C78 530 76 480 78 440 C78 400 78 365 80 350Z"
    stroke="#2A2620" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="#F8F4EC" fill-opacity="0.6"/>

  <!-- Silver-fibre grid on the sheet — characteristic product detail -->
  <!-- Horizontal grid lines -->
  <g stroke="#8C8276" stroke-width="0.6" opacity="0.35">
    <line x1="85" y1="368" x2="335" y2="366"/>
    <line x1="85" y1="388" x2="335" y2="386"/>
    <line x1="85" y1="408" x2="335" y2="406"/>
    <line x1="85" y1="428" x2="334" y2="426"/>
    <line x1="84" y1="448" x2="334" y2="446"/>
    <line x1="84" y1="468" x2="333" y2="466"/>
    <line x1="84" y1="488" x2="333" y2="486"/>
    <line x1="84" y1="508" x2="332" y2="506"/>
    <line x1="84" y1="528" x2="332" y2="526"/>
    <line x1="84" y1="548" x2="332" y2="546"/>
    <line x1="84" y1="568" x2="330" y2="566"/>
  </g>
  <!-- Vertical grid lines -->
  <g stroke="#8C8276" stroke-width="0.6" opacity="0.35">
    <line x1="105" y1="344" x2="103" y2="576"/>
    <line x1="125" y1="344" x2="123" y2="577"/>
    <line x1="145" y1="345" x2="143" y2="578"/>
    <line x1="165" y1="345" x2="163" y2="578"/>
    <line x1="185" y1="345" x2="183" y2="578"/>
    <line x1="205" y1="346" x2="203" y2="578"/>
    <line x1="225" y1="346" x2="223" y2="578"/>
    <line x1="245" y1="347" x2="243" y2="578"/>
    <line x1="265" y1="347" x2="263" y2="578"/>
    <line x1="285" y1="347" x2="283" y2="578"/>
    <line x1="305" y1="347" x2="303" y2="578"/>
    <line x1="322" y1="347" x2="321" y2="578"/>
