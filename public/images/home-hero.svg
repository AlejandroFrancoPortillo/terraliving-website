  <!-- A few scattered Ginkgo-like small leaf suggestions in the empty left third -->
  <!-- These are very small, ghost-like, keeping the left third airy -->
  <g opacity="0.22" stroke="#7C8B6A" stroke-width="0.7">
    <!-- Tiny ginkgo fan shape 1 -->
    <path d="M200 530 C196 520 190 512 188 506 C188 502 190 499 194 500 C196 502 200 510 200 518 Z"/>
    <path d="M200 530 C204 520 210 512 212 506 C212 502 210 499 206 500 C204 502 200 510 200 518"/>
    <line x1="200" y1="530" x2="200" y2="542"/>

    <!-- Tiny ginkgo fan shape 2 -->
    <path d="M160 440 C157 432 152 425 150 420 C150 417 152 415 155 416 C157 418 160 425 160 432 Z"/>
    <path d="M160 440 C163 432 168 425 170 420 C170 417 168 415 165 416 C163 418 160 425 160 432"/>
    <line x1="160" y1="440" x2="160" y2="450"/>
