    C1200 480 1165 480 1155 460
    C1148 445 1150 400 1152 380
    C1154 362 1160 354 1175 352
    C1185 350 1205 350 1215 352
    C1230 354 1238 362 1240 380
    C1242 400 1244 445 1237 460
    C1228 478 1200 480 1200 480Z"
    stroke="#2A2620" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F8F4EC" fill-opacity="0.5"/>

  <!-- Jar neck — narrower top section -->
  <path d="M1174 352 C1176 342 1178 334 1182 330 C1186 326 1194 324 1200 324 C1206 324 1214 326 1218 330 C1222 334 1224 342 1226 352"
    stroke="#2A2620" stroke-width="1.3" stroke-linecap="round" fill="none"/>

  <!-- Jar lid/cap — small flat cap -->
  <path d="M1180 330 C1182 322 1186 318 1200 317 C1214 318 1218 322 1220 330"
    stroke="#2A2620" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <path d="M1180 326 C1186 322 1214 322 1220 326"
    stroke="#2A2620" stroke-width="1" stroke-linecap="round" fill="none"/>
  <!-- Lid band ring -->
  <path d="M1178 330 C1186 334 1214 334 1222 330"
    stroke="#2A2620" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Amber tint — sparse sage strokes inside the jar to evoke amber glass -->
